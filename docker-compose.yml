services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aether_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 10s
      timeout: 5s
      retries: 10

  aether-api:
    build: .
    restart: unless-stopped
    environment:
      AETHER_DATABASE_URL: postgresql+psycopg://aether:${POSTGRES_PASSWORD}@db:5432/aether
      AETHER_JWT_SECRET: ${AETHER_JWT_SECRET:?Set AETHER_JWT_SECRET in .env}
      AETHER_BOOTSTRAP_KEY: ${AETHER_BOOTSTRAP_KEY:?Set AETHER_BOOTSTRAP_KEY in .env}
      AETHER_API_KEY: ${AETHER_API_KEY:-}
      AETHER_CORS_ORIGINS: ${AETHER_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  aether-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./pwa:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aether-api:
        condition: service_healthy

volumes:
  aether_pgdata:
